name: Docker Build (Reusable)

on:
  workflow_call:
    inputs:
      push:
        description: Authenticate to AWS, log in to ECR, and push images
        type: boolean
        required: false
        default: false
      image_tag:
        description: Immutable image tag (for example git commit SHA)
        type: string
        required: true
      project_name:
        description: Project name used as ECR repository prefix
        type: string
        required: false
        default: 'wordpress'

permissions:
  id-token: write
  contents: read

jobs:
  docker:
    name: Build${{ inputs.push && ' and push' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials
        if: inputs.push
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::156041402173:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        if: inputs.push
        uses: aws-actions/amazon-ecr-login@19d944daaa35f0fa1d3f7f8af1d3f2e5de25c5b7 # v2.1.4

      - name: Build WordPress image
        run: docker build -t ${{ inputs.project_name }}-php-fpm:latest docker/

      - name: Build nginx image
        run: docker build -t ${{ inputs.project_name }}-nginx:latest docker/nginx/

      - name: Run Trivy on WordPress image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.project_name }}-php-fpm:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Run Trivy on nginx image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.project_name }}-nginx:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push WordPress image to ECR
        if: inputs.push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ inputs.image_tag }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          docker tag "$PROJECT_NAME-php-fpm:latest" "$ECR_REGISTRY/$PROJECT_NAME-php-fpm:latest"
          docker tag "$PROJECT_NAME-php-fpm:latest" "$ECR_REGISTRY/$PROJECT_NAME-php-fpm:$TAG"
          docker push "$ECR_REGISTRY/$PROJECT_NAME-php-fpm:latest"
          docker push "$ECR_REGISTRY/$PROJECT_NAME-php-fpm:$TAG"

      - name: Push nginx image to ECR
        if: inputs.push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ inputs.image_tag }}
          PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          docker tag "$PROJECT_NAME-nginx:latest" "$ECR_REGISTRY/$PROJECT_NAME-nginx:latest"
          docker tag "$PROJECT_NAME-nginx:latest" "$ECR_REGISTRY/$PROJECT_NAME-nginx:$TAG"
          docker push "$ECR_REGISTRY/$PROJECT_NAME-nginx:latest"
          docker push "$ECR_REGISTRY/$PROJECT_NAME-nginx:$TAG"
