name: Terraform Apply - Main Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - '*.tf'
      - '*.tfvars'
      - '*.auto.tfvars'
      - 'modules/**'

concurrency:
  group: terraform-apply-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply - Main
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    outputs:
      alb_dns: ${{ steps.get-alb.outputs.alb_dns }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: '1.10.2'
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::156041402173:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        env:
          TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
          TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
        run: terraform plan -out=plan.tfplan -input=false

      - name: Terraform Apply
        env:
          TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
          TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
        run: terraform apply -input=false plan.tfplan

      - name: Get ALB DNS Name
        id: get-alb
        run: |
          alb_dns=$(terraform output -raw alb_dns_name 2>/dev/null || echo "")
          echo "alb_dns=${alb_dns}" >> "$GITHUB_OUTPUT"
          echo "ALB DNS: ${alb_dns}"

  docker-images:
    name: Docker images
    needs: terraform-apply
    uses: ./.github/workflows/docker-build-reusable.yml
    with:
      push: true
      image_tag: ${{ github.sha }}
    secrets: inherit

  dast:
    name: DAST (OWASP ZAP)
    needs:
      - terraform-apply
      - docker-images
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::156041402173:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Wait for ECS service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster wordpress-cluster \
            --services wordpress-service

      - name: Wait for load balancer
        run: |
          set -euo pipefail
          echo "Waiting 2 minutes for DNS propagation..."
          sleep 120
          for i in $(seq 1 90); do
            if curl -fsSL --max-time 15 "https://mywebsitehosting.net/" >/dev/null 2>&1; then
              echo "Site responded"
              exit 0
            fi
            echo "Waiting for site (${i}/90)..."
            sleep 10
          done
          echo "Site did not become reachable in time"
          exit 1

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: DAST Scan with OWASP ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'https://mywebsitehosting.net'
          rules_file_name: '/zap/wrk/.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false
