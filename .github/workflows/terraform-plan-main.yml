name: Terraform Plan - Main Infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - 'environments/production/**'
      - 'modules/**'

concurrency:
  group: terraform-plan-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan - Main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: '1.10.2'
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::156041402173:role/github-actions-oidc-role
          aws-region: us-east-1

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2

      - name: Terraform Init
        working-directory: environments/production
        run: terraform init

      - name: Terraform Format Check
        working-directory: environments/production
        run: terraform fmt -check

      - name: tflint
        working-directory: environments/production
        run: |
          tflint --init
          tflint

      - name: Terraform Validate
        working-directory: environments/production
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: environments/production
        env:
          TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME }}
          TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
          TF_VAR_aws_region: ${{ secrets.TF_VAR_AWS_REGION }}
        run: terraform plan -no-color -out=plan.tfplan 2>&1 | tee /tmp/plan_output.txt
        continue-on-error: true

      - name: Upload plan text
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-plan-text
          path: /tmp/plan_output.txt

      - name: Prepare plan comment
        run: |
          set -euo pipefail
          {
            echo '<!-- terraform-plan-main -->'
            echo '## Terraform Plan Results - Main Infrastructure'
            echo ''
            echo 'Full plan output is attached as workflow artifact **terraform-plan-text**.'
            echo ''
            echo '```hcl'
            head -c 58000 /tmp/plan_output.txt
            echo ''
            echo '```'
          } > /tmp/pr_comment.md
          if [ "$(wc -c < /tmp/plan_output.txt)" -gt 58000 ]; then
            echo '' >> /tmp/pr_comment.md
            echo '*Comment truncated; download the artifact for the complete plan.*' >> /tmp/pr_comment.md
          fi

      - name: Find plan comment
        id: find
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- terraform-plan-main -->'

      - name: Comment Plan on PR
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: /tmp/pr_comment.md
          edit-mode: replace

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
