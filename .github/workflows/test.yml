name: Integration Test

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'docker/**'
      - 'tests/**'
      - 'modules/**'
      - 'environments/**'

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: WordPress Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start Docker Compose
        run: docker compose -f tests/docker-compose.yml up -d

      - name: Wait for WordPress to be ready
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 5 "http://localhost:80/" >/dev/null 2>&1; then
              echo "WordPress is ready"
              exit 0
            fi
            echo "Waiting for WordPress (${i}/30)..."
            sleep 10
          done
          echo "WordPress did not become ready in time"
          docker compose -f tests/docker-compose.yml logs
          exit 1

      - name: DAST Scan with OWASP ZAP
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:80'
          rules_file_name: '/zap/wrk/.zap/rules.tsv'
          cmd_options: '-a -I'
          fail_action: false
          allow_issue_writing: false

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f tests/docker-compose.yml down -v
